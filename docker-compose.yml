services:
  automate-jev-api:
    image: ghcr.io/${GH_OWNER}/automate-jev-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ./data:/app/.automate-jev
      - ./mcp-auth:/root/.mcp-auth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  automate-jev-daily-progress:
    image: ghcr.io/${GH_OWNER}/automate-jev-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/.automate-jev
      - ./mcp-auth:/root/.mcp-auth
    command: ["sh", "-c", "while true; do automate-jev-daily-progress; sleep 86400; done"]
