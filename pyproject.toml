[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "automate-jev"
version = "0.1.0"
description = "Safety-first workflow runtime with Jev as a bounded decision router"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Automate Jev contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
automate-jev-demo = "automate_jev.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automate_jev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
