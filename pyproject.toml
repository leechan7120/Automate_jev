[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "automate-jev"
version = "0.1.0"
description = "Safety-first workflow runtime with Jev as a bounded decision router"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Automate Jev contributors" }]
dependencies = [
  "fastapi>=0.115",
  "google-genai>=1.0",
  "jsonschema>=4.23",
  "python-multipart>=0.0.20",
  "typesafe-sdk>=0.6.0",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
automate-jev-demo = "automate_jev.demo:main"
automate-jev-jev-smoke = "automate_jev.live_smoke:main"
automate-jev-windows-smoke = "automate_jev.windows_ui_smoke:main"
automate-jev-integrated-demo = "automate_jev.integrated_demo:main"
automate-jev-api = "automate_jev.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automate_jev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
